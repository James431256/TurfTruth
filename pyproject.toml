[project]
name = "my-app"
version = "0.1.0"
description = "TurfTruth: garden photo labour quotes and weather-safe booking"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

