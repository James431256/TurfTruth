name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  DEMO_MODE: "1"
  HOURLY_RATE_PENCE: "2500"

jobs:
  lint-and-test:
    name: Lint, Unit & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run unit and API tests (DEMO_MODE=1)
        run: uv run pytest --ignore=tests/e2e -v

      - name: Run offline DEMO_MODE evals
        run: uv run python evals/run_evals.py

  e2e:
    name: End-to-End Browser Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies and Playwright Chromium
        run: |
          uv venv --python 3.14
          uv pip install -r requirements-dev.txt
          uv run playwright install --with-deps chromium

      - name: Run Playwright E2E suite (DEMO_MODE=1)
        run: uv run pytest tests/e2e -v

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/screenshots/
